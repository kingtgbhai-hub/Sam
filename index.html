<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Night Play App</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #050505; color: #ffffff; font-family: 'Poppins', sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; text-align: center; }
        
        .app-icon { width: 90px; height: 90px; background: #111; border-radius: 20px; margin: 30px auto 15px auto; display: flex; justify-content: center; align-items: center; overflow: hidden; border: 2px solid #ff0055; box-shadow: 0 0 20px rgba(255, 0, 85, 0.4); }
        .app-icon img { width: 100%; height: 100%; object-fit: cover; }
        
        h1 { font-size: 26px; font-weight: 700; margin-bottom: 10px; }
        p { font-size: 14px; color: #aaaaaa; margin-bottom: 30px; }
        
        .download-btn { display: block; width: 100%; background: linear-gradient(90deg, #ff0055, #ff4d88); color: #ffffff; text-align: center; padding: 18px; border-radius: 30px; font-size: 18px; font-weight: 700; text-decoration: none; margin-bottom: 35px; box-shadow: 0 6px 20px rgba(255, 0, 85, 0.4); }
        
        .feature-box { background: #111111; padding: 20px; border-radius: 15px; border-left: 4px solid #ff0055; margin-bottom: 15px; text-align: left; }
        .feature-box h3 { font-size: 16px; margin-bottom: 5px; }
        .feature-box p { font-size: 13px; margin-bottom: 0; }
    </style>
</head>
<body>

    <div class="app-icon">
        <img src="logo.jpg" alt="Logo">
    </div>
    <h1>Night Play</h1>
    <p>Meet & Connect</p>

    <!-- Yahan tumhara naya APK link lag gaya hai -->
    <a href="nightplay.apk" download class="download-btn">Download Now</a>

    <div class="feature-box">
        <h3>💬 Private Chat</h3>
        <p>Chat securely with your new friends.</p>
    </div>
    <div class="feature-box">
        <h3>📹 Video Calls</h3>
        <p>Meet face-to-face with high quality video.</p>
    </div>
    <div class="feature-box">
        <h3>🛡️ 100% Safe</h3>
        <p>Your privacy is our top priority.</p>
    </div>

</body>
</html>
